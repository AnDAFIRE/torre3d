<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Torre 3D AR</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#000;overflow:hidden;font-family:'Courier New',monospace;}

/* VIDEO de fondo = cámara real */
#cam{
  position:fixed;inset:0;width:100%;height:100%;
  object-fit:cover;z-index:0;display:none;
}

/* Three.js encima de la cámara */
#c3d{
  position:fixed;inset:0;width:100%;height:100%;
  z-index:1;background:#0a0a14;transition:background .3s;
}
#c3d.ar-mode{ background:transparent; }

/* UI top */
#ui{
  position:fixed;top:0;left:0;right:0;
  padding:12px 16px;z-index:20;
  display:flex;justify-content:space-between;align-items:center;
  background:linear-gradient(to bottom,rgba(0,0,0,.7),transparent);
  pointer-events:none;
}
#title{color:#c8f0ff;font-size:10px;letter-spacing:.15em;}
#title b{display:block;font-size:16px;color:#fff;}
#arBadge{
  display:none;background:rgba(0,200,80,.2);
  border:1px solid #4f9;color:#4f9;
  font-size:10px;padding:4px 10px;border-radius:20px;
  pointer-events:none;
}
#arBadge.show{display:block;}

/* Botones */
#controls{
  position:fixed;bottom:0;left:0;right:0;z-index:20;
  display:flex;justify-content:center;gap:8px;
  flex-wrap:nowrap;overflow-x:auto;
  padding:10px 8px 16px;
  background:linear-gradient(to top,rgba(0,0,0,.75),transparent);
}
.btn{
  flex-shrink:0;
  background:rgba(0,140,255,.2);border:1px solid rgba(0,160,255,.5);
  color:#8df;padding:10px 14px;border-radius:20px;
  font-size:12px;cursor:pointer;white-space:nowrap;
  -webkit-tap-highlight-color:transparent;
}
.btn:active,.btn.on{background:rgba(0,200,255,.4);color:#fff;border-color:#4af;}
.btn.ar{background:rgba(0,200,80,.2);border-color:rgba(0,220,100,.5);color:#4f9;}
.btn.ar.on{background:rgba(0,200,80,.4);}

/* Formula */
#formula{
  display:none;position:fixed;top:60px;right:10px;
  background:rgba(0,0,0,.75);border:1px solid rgba(0,160,255,.3);
  border-radius:10px;padding:10px 12px;font-size:11px;
  color:#6af;line-height:2;z-index:20;pointer-events:none;
}
#formula.show{display:block;}

/* Hint AR */
#arHint{
  display:none;position:fixed;top:50%;left:50%;
  transform:translate(-50%,-50%);
  color:rgba(255,255,255,.5);font-size:13px;text-align:center;
  z-index:20;pointer-events:none;letter-spacing:.05em;
}
#arHint.show{display:block;}
</style>
</head>
<body>

<video id="cam" autoplay playsinline muted></video>
<canvas id="c3d"></canvas>

<div id="ui">
  <div id="title">Probabilidad<b>TORRE 3D</b></div>
  <div id="arBadge">● AR ACTIVO</div>
</div>

<div id="formula">
  <small style="color:#445;letter-spacing:.1em">CAMPO VECTORIAL</small><br>
  F&#x2081; = 2xy + sin(y) + 3<br>
  F&#x2082; = x&sup2; + x&middot;cos(y) + e&#x02b8; + 1<br>
  F&#x2083; = 0
</div>

<div id="arHint">Apunta la cámara a una<br>superficie plana</div>

<div id="controls">
  <button class="btn ar" id="btnAR">📷 Cámara AR</button>
  <button class="btn" id="btnVec">&#x21F6; Campo</button>
  <button class="btn" id="btnSpin">&#x27F3; Girar</button>
  <button class="btn" id="btnWire">&#x25A1; Wire</button>
  <button class="btn" id="btnReset">&#x2299; Reset</button>
</div>

// ── RENDERER ─────────────────────────────────────────
var canvas=document.getElementById('c3d');
var scene=new THREE.Scene();
scene.background=new THREE.Color(0x0a0a14);

var cam3=new THREE.PerspectiveCamera(50,innerWidth/innerHeight,0.01,500);
cam3.position.set(0,4,22);

var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);

// ── GEOMETRY ─────────────────────────────────────────
var geo=new THREE.BufferGeometry();
geo.setAttribute('position',new THREE.BufferAttribute(new Float32Array(VERTS),3));
geo.setAttribute('normal',  new THREE.BufferAttribute(new Float32Array(NORMS),3));
var bb=new THREE.Box3().setFromBufferAttribute(geo.attributes.position);
var ctr=new THREE.Vector3(); bb.getCenter(ctr);
geo.translate(-ctr.x,-ctr.y,-ctr.z);

var matS=new THREE.MeshStandardMaterial({color:0x1a88dd,metalness:.45,roughness:.3,side:THREE.DoubleSide});
var matW=new THREE.MeshBasicMaterial({color:0x00ccff,wireframe:true,transparent:true,opacity:.8});
var mesh=new THREE.Mesh(geo,matS); scene.add(mesh);
var wire=new THREE.Mesh(geo,matW); wire.visible=false; scene.add(wire);

var bbM=new THREE.Box3().setFromObject(mesh);
var grid=new THREE.GridHelper(24,24,0x0d1e30,0x0a1520);
grid.position.y=bbM.min.y; scene.add(grid);

// ── LIGHTS ───────────────────────────────────────────
scene.add(new THREE.AmbientLight(0x334455,1.4));
var dl=new THREE.DirectionalLight(0xffffff,1.5); dl.position.set(10,20,10); scene.add(dl);
var pl=new THREE.PointLight(0x0088ff,2,40); pl.position.set(-8,5,8); scene.add(pl);

// ── VECTOR FIELD ─────────────────────────────────────
function Fv(x,y){return [2*x*y+Math.sin(y)+3,x*x+x*Math.cos(y)+Math.exp(Math.min(y,4))+1];}
function mCol(m,mx){
  var t=Math.min(m/mx,1),cs=[0x0055ff,0x00ccff,0x00ff88,0xffee00,0xff3300];
  var s=(cs.length-1)*t,i=Math.min(Math.floor(s),cs.length-2);
  return new THREE.Color(cs[i]).lerp(new THREE.Color(cs[i+1]),s-i);
}
var vg=new THREE.Group(); scene.add(vg); vg.visible=false;
(function(){
  var G=6,R=5,S=0.35,mx=0,pts=[];
  for(var a=0;a<G;a++) for(var b=0;b<G;b++) for(var c=0;c<3;c++){
    var px=-R+(2*R/(G-1))*a,py=-R+(2*R/(G-1))*b,pz=-1.5+1.5*c;
    var fv=Fv(px,py),m=Math.sqrt(fv[0]*fv[0]+fv[1]*fv[1]);
    mx=Math.max(mx,m); pts.push({x:px,y:py,z:pz,fx:fv[0],fy:fv[1],m:m});
  }
  pts.forEach(function(p){
    var nl=Math.min(p.m*S,2),sl=nl*.72,hl=nl*.28,tk=0.04;
    var mat=new THREE.MeshStandardMaterial({color:mCol(p.m,mx),transparent:true,opacity:.85});
    var g=new THREE.Group();
    var sh=new THREE.Mesh(new THREE.CylinderGeometry(tk,tk,sl,6),mat); sh.position.y=sl/2;
    var hd=new THREE.Mesh(new THREE.CylinderGeometry(0,tk*2.5,hl,7),mat); hd.position.y=sl+hl/2;
    g.add(sh,hd);
    var d=new THREE.Vector3(p.fx,p.fy,0).normalize();
    if(d.lengthSq()>0.0001) g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d);
    g.position.set(p.x,p.z,p.y); vg.add(g);
  });
})();

// ── CONTROLS (touch/mouse) ────────────────────────────
var rotX=.25,rotY=0,scl=1,autoSpin=true,wireOn=false,vecOn=false,arOn=false;
var isDown=false,lx=0,ly=0,pd0=0,sc0=1;

function applyT(){
  [mesh,wire,vg].forEach(function(o){o.rotation.x=rotX;o.rotation.y=rotY;o.scale.setScalar(scl);});
  grid.rotation.y=rotY; grid.scale.setScalar(scl);
}

canvas.addEventListener('mousedown',function(e){isDown=true;lx=e.clientX;ly=e.clientY;});
window.addEventListener('mouseup',function(){isDown=false;});
window.addEventListener('mousemove',function(e){
  if(!isDown)return;
  rotY+=(e.clientX-lx)*.008;rotX+=(e.clientY-ly)*.008;lx=e.clientX;ly=e.clientY;applyT();
});
canvas.addEventListener('wheel',function(e){scl*=e.deltaY>0?.93:1.07;scl=Math.max(.1,Math.min(5,scl));applyT();},{passive:true});
canvas.addEventListener('touchstart',function(e){
  if(e.touches.length===1){isDown=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
  if(e.touches.length===2){isDown=false;pd0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);sc0=scl;}
},{passive:true});
canvas.addEventListener('touchend',function(){isDown=false;},{passive:true});
canvas.addEventListener('touchmove',function(e){
  if(e.touches.length===1&&isDown){
    rotY+=(e.touches[0].clientX-lx)*.012;rotX+=(e.touches[0].clientY-ly)*.012;
    lx=e.touches[0].clientX;ly=e.touches[0].clientY;applyT();
  }
  if(e.touches.length===2){
    var d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
    scl=Math.max(.1,Math.min(5,sc0*(d/pd0)));applyT();
  }
},{passive:true});

// ── AR (WebRTC camera background) ────────────────────
var video=document.getElementById('cam');
var stream=null;

async function startAR(){
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });
    video.srcObject=stream;
    video.style.display='block';
    canvas.classList.add('ar-mode');
    scene.background=null;
    grid.visible=false;
    document.getElementById('arBadge').classList.add('show');
    document.getElementById('arHint').classList.add('show');
    setTimeout(function(){document.getElementById('arHint').classList.remove('show');},3000);
    arOn=true;
    document.getElementById('btnAR').textContent='✕ Cerrar AR';
    document.getElementById('btnAR').classList.add('on');
  } catch(err){
    alert('No se pudo acceder a la cámara.\nAsegúrate de dar permiso cuando Chrome lo pida.\nError: '+err.message);
  }
}

function stopAR(){
  if(stream) stream.getTracks().forEach(function(t){t.stop();});
  video.style.display='none';
  video.srcObject=null;
  canvas.classList.remove('ar-mode');
  scene.background=new THREE.Color(0x0a0a14);
  grid.visible=true;
  document.getElementById('arBadge').classList.remove('show');
  arOn=false;
  document.getElementById('btnAR').textContent='📷 Cámara AR';
  document.getElementById('btnAR').classList.remove('on');
}

document.getElementById('btnAR').addEventListener('click',function(){
  arOn?stopAR():startAR();
});

// ── OTROS BOTONES ─────────────────────────────────────
document.getElementById('btnVec').addEventListener('click',function(){
  vecOn=!vecOn; vg.visible=vecOn;
  document.getElementById('formula').classList.toggle('show',vecOn);
  this.classList.toggle('on',vecOn);
  this.textContent=vecOn?'⇶ Ocultar':'⇶ Campo';
});
document.getElementById('btnSpin').addEventListener('click',function(){
  autoSpin=!autoSpin;
  this.classList.toggle('on',autoSpin);
  this.textContent=autoSpin?'⏸ Pausar':'⟳ Girar';
});
document.getElementById('btnWire').addEventListener('click',function(){
  wireOn=!wireOn; mesh.visible=!wireOn; wire.visible=wireOn;
  this.classList.toggle('on',wireOn);
  this.textContent=wireOn?'■ Solido':'□ Wire';
});
document.getElementById('btnReset').addEventListener('click',function(){
  rotX=.25;rotY=0;scl=1;applyT();
});

// ── LOOP ─────────────────────────────────────────────
var t=0;
(function loop(){
  requestAnimationFrame(loop);
  t+=.01;
  if(autoSpin){rotY+=.007;applyT();}
  pl.intensity=1.8+Math.sin(t)*0.5;
  renderer.render(scene,cam3);
})();

window.addEventListener('resize',function(){
  cam3.aspect=innerWidth/innerHeight; cam3.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

applyT();
</script>
