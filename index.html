// F = [2x*y + sin(y) + 3,  x^2 + x*cos(y) + exp(y) + 1,  0]
function F(x,y) {
  return [
    2*x*y + Math.sin(y) + 3,
    x*x + x*Math.cos(y) + Math.exp(y) + 1,
    0
  ];
}

// Pre-build arrows on a grid around the tower
(function buildVectorField() {
  const GRID = 7;    // grid points per axis
  const RANGE = 6;   // spatial range
  const SCALE = 0.4; // arrow scale factor

  // Arrow geometry factory
  function makeArrow(dir3, origin, len, color) {
    const g = new THREE.Group();
    const normLen = Math.min(len * SCALE, 2.2);
    const shaftLen = normLen * 0.72;
    const headLen  = normLen * 0.28;
    const thick = 0.045;

    // shaft
    const shaftGeo = new THREE.CylinderGeometry(thick, thick, shaftLen, 6);
    const mat = new THREE.MeshStandardMaterial({color, metalness:.2, roughness:.5, transparent:true, opacity:.82});
    const shaft = new THREE.Mesh(shaftGeo, mat);
    shaft.position.y = shaftLen/2;

    // head
    const headGeo = new THREE.CylinderGeometry(0, thick*2.8, headLen, 7);
    const head = new THREE.Mesh(headGeo, mat);
    head.position.y = shaftLen + headLen/2;

    g.add(shaft, head);

    // orient along dir3
    const up = new THREE.Vector3(0,1,0);
    const d  = new THREE.Vector3(...dir3).normalize();
    if(d.lengthSq() < 0.0001) return null;
    const q  = new THREE.Quaternion().setFromUnitVectors(up, d);
    g.setRotationFromQuaternion(q);
    g.position.set(...origin);
    return g;
  }

  // Color by magnitude (blue→cyan→green→yellow→red)
  function magColor(m, maxM) {
    const t = Math.min(m/maxM, 1);
    // lerp: 0x0055ff → 0x00ffff → 0x00ff44 → 0xffee00
    const colors = [0x0055ff, 0x00ccff, 0x00ff88, 0xffee00, 0xff3300];
    const seg = (colors.length-1)*t;
    const i = Math.min(Math.floor(seg), colors.length-2);
    const f = seg - i;
    const a = new THREE.Color(colors[i]);
    const b = new THREE.Color(colors[i+1]);
    return new THREE.Color().lerpColors(a,b,f);
  }

  // Sample grid
  const arrows = [];
  let maxM = 0;
  for(let ix=0;ix<GRID;ix++) {
    for(let iy=0;iy<GRID;iy++) {
      for(let iz=0;iz<3;iz++) { // only 3 z levels
        const x = -RANGE + (2*RANGE/(GRID-1))*ix;
        const y = -RANGE + (2*RANGE/(GRID-1))*iy;
        const z = -2 + 2*iz;
        const [fx,fy,fz] = F(x,y);
        const m = Math.sqrt(fx*fx+fy*fy);
        maxM = Math.max(maxM,m);
        arrows.push({x,y,z,fx,fy,fz:0,m});
      }
    }
  }

  arrows.forEach(({x,y,z,fx,fy,m}) => {
    const color = magColor(m, maxM);
    const a = makeArrow([fx,fy,0],[x,z,y],m,color);
    if(a) vecGroup.add(a);
  });
})();

// ── INTERACTION ──────────────────────────────────────
let isDown=false,lastX=0,lastY=0,rotX=.25,rotY=0,scl=1,autoSpin=false,wireMode=false;
let pinchD0=0,scl0=1;

function applyT(){
  [mesh,wireMesh,vecGroup].forEach(o=>{
    o.rotation.x=rotX; o.rotation.y=rotY;
    o.scale.set(scl,scl,scl);
  });
  grid.rotation.y=rotY; grid.scale.set(scl,scl,scl);
}

renderer.domElement.addEventListener('mousedown',e=>{isDown=true;lastX=e.clientX;lastY=e.clientY;});
window.addEventListener('mouseup',()=>isDown=false);
window.addEventListener('mousemove',e=>{
  if(!isDown)return;
  rotY+=(e.clientX-lastX)*.008; rotX+=(e.clientY-lastY)*.008;
  lastX=e.clientX;lastY=e.clientY; applyT();
});
renderer.domElement.addEventListener('wheel',e=>{
  scl*=e.deltaY>0?.93:1.07; scl=Math.max(.15,Math.min(5,scl)); applyT();
},{passive:true});

renderer.domElement.addEventListener('touchstart',e=>{
  if(e.touches.length===1){isDown=true;lastX=e.touches[0].clientX;lastY=e.touches[0].clientY;}
  if(e.touches.length===2){
    isDown=false;
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    pinchD0=Math.hypot(dx,dy);scl0=scl;
  }
},{passive:true});
renderer.domElement.addEventListener('touchend',()=>isDown=false,{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{
  if(e.touches.length===1&&isDown){
    rotY+=(e.touches[0].clientX-lastX)*.011; rotX+=(e.touches[0].clientY-lastY)*.011;
    lastX=e.touches[0].clientX;lastY=e.touches[0].clientY; applyT();
  }
  if(e.touches.length===2){
    const dx=e.touches[0].clientX-e.touches[1].clientX;
    const dy=e.touches[0].clientY-e.touches[1].clientY;
    scl=Math.max(.15,Math.min(5,scl0*(Math.hypot(dx,dy)/pinchD0))); applyT();
  }
},{passive:true});

const btnAR = document.getElementById('btnAR');

async function startAR(){
  if(!navigator.xr){ alert('Tu navegador no soporta WebXR AR.\nUsa Chrome en Android o Safari 16+ en iOS.'); return; }
  const supported = await navigator.xr.isSessionSupported('immersive-ar').catch(()=>false);
  if(!supported){ alert('Realidad Aumentada no disponible en este dispositivo.\n\nAsegúrate de:\n• Usar Chrome en Android\n• Tener ARCore instalado'); return; }

  renderer.xr.enabled = true;
  const session = await navigator.xr.requestSession('immersive-ar',{
    requiredFeatures:['hit-test'],
    optionalFeatures:['dom-overlay'],
    domOverlay:{root:document.body}
  }).catch(e=>{ alert('No se pudo iniciar AR: '+e.message); return null; });
  if(!session) return;

  renderer.xr.setSession(session);
  scene.background = null;
  scene.fog = null;
  grid.visible = false;

  // Reticle for placement
  const reticleGeo = new THREE.RingGeometry(.08,.1,32);
  reticleGeo.rotateX(-Math.PI/2);
  const reticle = new THREE.Mesh(reticleGeo, new THREE.MeshBasicMaterial({color:0x00ff88,side:THREE.DoubleSide}));
  reticle.visible=false;
  scene.add(reticle);

  let hitTestSource=null, placed=false;
  session.addEventListener('select',()=>{
    if(reticle.visible){
      mesh.position.copy(reticle.position);
      wireMesh.position.copy(reticle.position);
      vecGroup.position.copy(reticle.position);
      placed=true;
      reticle.visible=false;
    }
  });

  const refSpace = await session.requestReferenceSpace('local');
  const viewerSpace = await session.requestReferenceSpace('viewer');
  hitTestSource = await session.requestHitTestSource({space:viewerSpace});

  btnAR.textContent='✕ Salir AR';

  renderer.setAnimationLoop((ts,frame)=>{
    if(frame){
      const hits=frame.getHitTestResults(hitTestSource);
      if(hits.length>0){
        const pose=hits[0].getPose(refSpace);
        reticle.visible=!placed;
        reticle.matrix.fromArray(pose.transform.matrix);
        reticle.matrix.decompose(reticle.position,reticle.quaternion,reticle.scale);
      } else { reticle.visible=false; }
    }
    if(autoSpin){rotY+=.008;applyT();}
    renderer.render(scene,cam);
  });

  session.addEventListener('end',()=>{
    scene.background=new THREE.Color(0x0a0a14);
    scene.fog=new THREE.FogExp2(0x0a0a14,.03);
    grid.visible=true;
    scene.remove(reticle);
    btnAR.textContent='📷 Realidad Aumentada';
    renderer.setAnimationLoop(null);
    placed=false;
    startNormalLoop();
  });
}

btnAR.addEventListener('click', startAR);

// ── NORMAL RENDER LOOP ────────────────────────────────
let t=0;
function startNormalLoop(){
  function animate(){
    requestAnimationFrame(animate);
    if(renderer.xr.isPresenting) return;
    t+=.01;
    if(autoSpin){rotY+=.008;applyT();}
    pBlue.intensity=1.8+Math.sin(t*1.3)*.6;
    pRim.intensity =.9+Math.cos(t*.9)*.3;
    renderer.render(scene,cam);
  }
  animate();
}

window.addEventListener('resize',()=>{
  cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

applyT();
startNormalLoop();
</script>
